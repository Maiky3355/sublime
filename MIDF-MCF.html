<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MIDF–MCF Ingeniería | Consola Profesional</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Segoe UI;background:#f4f6f9;margin:0;display:flex;height:100vh}
.sidebar{width:420px;background:#fff;padding:20px;overflow:auto;border-right:2px solid #ddd}
.main{flex:1;padding:30px;overflow:auto}
h2{font-size:14px;color:#1e3a8a;border-bottom:1px solid #ddd;padding-bottom:6px}
input,select{width:100%;padding:8px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px}
button{padding:10px;width:100%;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.btn{background:#1e3a8a;color:white}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.green{background:#dcfce7;color:#065f46}
.yellow{background:#fef3c7;color:#92400e}
.red{background:#fee2e2;color:#991b1b}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:10px;border-bottom:1px solid #eee;font-size:13px}
.small{font-size:12px;color:#555}
.dynamic-row{display:flex;gap:5px;margin-bottom:5px}
.dynamic-row input{flex:1}
</style>
</head>
<body>

<div class="sidebar">

<h2>1. Subsistema</h2>
<input id="name" placeholder="Nombre subsistema">
<input id="life" type="number" placeholder="Vida nominal (horas)">
<input id="weight" type="number" placeholder="Criticidad (peso)">

<h2>2. Fecha medición</h2>
<input id="datetime" type="datetime-local">

<h2>3. Factores base MIDF</h2>
<input id="ref_load" type="number" placeholder="Carga diseño">
<input id="real_load" type="number" placeholder="Carga real">
<input id="env" type="number" step="0.01" placeholder="E (ambiente)">
<input id="pres" type="number" step="0.01" placeholder="P (presión)">
<input id="grav" type="number" step="0.01" placeholder="G (gravedad)">
<input id="surf" type="number" step="0.01" placeholder="S (superficie)">
<input id="mcf" type="number" step="0.01" placeholder="C (MCF)">

<h2>4. Factores degradantes dinámicos</h2>
<div id="dynamicFactors"></div>
<button onclick="addFactor()">+ Agregar Factor</button>

<br><br>
<button class="btn" onclick="processData()">PROCESAR</button>
<br><br>
<button onclick="exportJSON()">Exportar JSON</button>

</div>

<div class="main">

<h1>D_sys: <span id="dsys">0.0000</span></h1>
<div id="globalStatus"></div>

<h2>Estado Subsistemas</h2>
<table>
<thead>
<tr>
<th>Subsistema</th>
<th>D_i</th>
<th>λ</th>
<th>Vida restante (h)</th>
<th>Estado</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<h2>Evolución Temporal</h2>
<canvas id="chart"></canvas>

<h2>Historial</h2>
<select id="historySelect" onchange="loadHistory()"></select>
<div id="historyBox" class="small"></div>

</div>

<script>

let db = JSON.parse(localStorage.getItem("midf_db")) || [];
let chart;

function addFactor(){
    const container=document.getElementById("dynamicFactors");
    const row=document.createElement("div");
    row.className="dynamic-row";
    row.innerHTML=`
        <input placeholder="Nombre factor">
        <input type="number" step="0.01" placeholder="Valor">
    `;
    container.appendChild(row);
}

function processData(){

    const name=document.getElementById("name").value;
    const life=parseFloat(document.getElementById("life").value);
    const weight=parseFloat(document.getElementById("weight").value);
    const dtInput=document.getElementById("datetime").value;

    const ref=parseFloat(document.getElementById("ref_load").value);
    const real=parseFloat(document.getElementById("real_load").value);

    const L=real/ref;
    const E=parseFloat(document.getElementById("env").value)||1;
    const P=parseFloat(document.getElementById("pres").value)||1;
    const G=parseFloat(document.getElementById("grav").value)||1;
    const S=parseFloat(document.getElementById("surf").value)||1;
    const C=parseFloat(document.getElementById("mcf").value)||1;

    const lambdaBase=1/life;

    let Fk=1;
    let factorData={};
    document.querySelectorAll("#dynamicFactors .dynamic-row").forEach(r=>{
        const fname=r.children[0].value;
        const fval=parseFloat(r.children[1].value)||1;
        if(fname){
            Fk*=fval;
            factorData[fname]=fval;
        }
    });

    const lambda=lambdaBase*L*E*P*G*S*C*Fk;

    let sub=db.find(s=>s.name===name);
    const now=new Date(dtInput);

    if(!sub){
        sub={name,weight,history:[],D:0};
        db.push(sub);
    }

    let lastDate=sub.history.length? new Date(sub.history[sub.history.length-1].date):now;
    let deltaH=(now-lastDate)/3600000;
    if(deltaH<0) deltaH=0;

    sub.D+=lambda*deltaH;

    let vidaRest=(1-sub.D)/lambda;
    if(sub.D>1) vidaRest=-(sub.D-1)/lambda;

    sub.history.push({
        date:dtInput,
        lambda,
        D:sub.D,
        lifeRemaining:vidaRest,
        factors:{L,E,P,G,S,C,...factorData}
    });

    localStorage.setItem("midf_db",JSON.stringify(db));

    render();
}

function render(){

    const body=document.getElementById("tableBody");
    body.innerHTML="";
    let totalW=db.reduce((a,b)=>a+b.weight,0);
    let Dsys=0;

    db.forEach(s=>{
        let last=s.history[s.history.length-1];
        let pond=s.weight/totalW;
        Dsys+=s.D*pond;

        let stateClass="green";
        let stateText="OPERATIVO";

        if(s.D>=1){stateClass="red";stateText="FALLA FUNCIONAL";}
        else if(s.D>=0.7){stateClass="yellow";stateText="CRÍTICO";}

        body.innerHTML+=`
        <tr>
        <td>${s.name}</td>
        <td>${s.D.toFixed(4)}</td>
        <td>${last.lambda.toExponential(3)}</td>
        <td>${Math.round(last.lifeRemaining)}</td>
        <td><span class="badge ${stateClass}">${stateText}</span></td>
        </tr>
        `;
    });

    document.getElementById("dsys").innerText=Dsys.toFixed(4);

    renderChart();
    loadHistorySelect();
}

function renderChart(){
    const ctx=document.getElementById("chart");
    if(chart) chart.destroy();

    let labels=[];
    let data=[];
    if(db.length){
        let sub=db[0];
        sub.history.forEach(h=>{
            labels.push(h.date);
            data.push(h.D);
        });
    }

    chart=new Chart(ctx,{
        type:'line',
        data:{
            labels,
            datasets:[{
                label:'D_i',
                data,
                borderColor:'red',
                fill:false
            }]
        }
    });
}

function loadHistorySelect(){
    const sel=document.getElementById("historySelect");
    sel.innerHTML="";
    db.forEach((s,i)=>{
        sel.innerHTML+=`<option value="${i}">${s.name}</option>`;
    });
}

function loadHistory(){
    const index=document.getElementById("historySelect").value;
    const box=document.getElementById("historyBox");
    if(db[index]){
        box.innerHTML=db[index].history.map(h=>
            `${h.date} | D=${h.D.toFixed(3)} | λ=${h.lambda.toExponential(2)} | Vida=${Math.round(h.lifeRemaining)}h`
        ).join("<br>");
    }
}

function exportJSON(){
    const dataStr="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(db,null,2));
    const a=document.createElement('a');
    a.href=dataStr;
    a.download="midf_mcf_historial.json";
    a.click();
}

render();

</script>
</body>
</html>
