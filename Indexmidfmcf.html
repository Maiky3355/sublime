<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDF-MCF v3.0 - Pure HTML+JS</title>
    <style>
        /* ============================================================
           ESTILOS CSS INTEGRADOS
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #1a237e;
            --primary-light: #283593;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --critical: #ff1744;
            --gray-100: #f8f9fa;
            --gray-200: #e9ecef;
            --gray-600: #6c757d;
            --gray-800: #343a40;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            color: var(--gray-800);
        }
        
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 25px 40px;
            box-shadow: 0 4px 20px rgba(26, 35, 126, 0.3);
        }
        
        .header h1 { font-size: 28px; font-weight: 300; letter-spacing: -0.5px; }
        .header p { opacity: 0.9; font-size: 14px; margin-top: 5px; }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 30px;
        }
        
        @media (max-width: 1024px) {
            .container { grid-template-columns: 1fr; }
        }
        
        .panel {
            background: white;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            border: 1px solid var(--gray-200);
        }
        
        .panel h2 {
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e8eaf6;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* Formulario */
        .form-group { margin-bottom: 18px; }
        
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--gray-600);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        
        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--gray-200);
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
            background: var(--gray-100);
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-light);
            background: white;
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.08);
        }
        
        .hint {
            font-size: 11px;
            color: var(--gray-600);
            margin-top: 4px;
        }
        
        button[type="submit"] {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        
        button[type="submit"]:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(26, 35, 126, 0.25);
        }
        
        .btn-sec {
            background: var(--gray-200);
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            margin-top: 12px;
            margin-right: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--gray-800);
            transition: all 0.2s;
        }
        
        .btn-sec:hover { background: #dee2e6; }
        
        /* Resultados */
        .midf-card { animation: fadeIn 0.4s ease; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .midf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e8eaf6;
        }
        
        .midf-header h3 { font-size: 20px; color: var(--primary); }
        .midf-header small { color: var(--gray-600); font-weight: normal; }
        
        .alerta {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .alerta-verde { background: #c8e6c9; color: #1b5e20; }
        .alerta-amarillo { background: #fff9c4; color: #f57f17; }
        .alerta-rojo { background: #ffcdd2; color: #c62828; }
        .alerta-critico { background: var(--critical); color: white; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .metricas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .metrica {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, var(--gray-100) 0%, white 100%);
            border-radius: 12px;
            border: 1px solid var(--gray-200);
        }
        
        .metrica .valor {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }
        
        .metrica .label {
            font-size: 11px;
            color: var(--gray-600);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .barra-container {
            margin-top: 10px;
            height: 8px;
            background: var(--gray-200);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .barra-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s ease;
        }
        
        .seccion {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--gray-200);
        }
        
        .seccion h4 {
            font-size: 13px;
            color: var(--gray-600);
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        
        table.factores {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
        }
        
        table.factores td {
            padding: 10px 0;
            border-bottom: 1px solid var(--gray-200);
        }
        
        table.factores td:first-child { color: var(--gray-600); }
        table.factores td:last-child { 
            text-align: right; 
            font-family: 'SF Mono', monospace;
            font-weight: 500;
        }
        
        table.factores tr.total td {
            font-weight: 700;
            color: var(--primary);
            border-bottom: none;
            font-size: 14px;
        }
        
        .evento-box {
            margin-top: 16px;
            padding: 14px;
            background: #e8f5e9;
            border-radius: 10px;
            border-left: 4px solid var(--success);
            font-size: 13px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray-600);
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }
        
        /* Tabs para cambiar modo */
        .modo-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .modo-tab {
            flex: 1;
            padding: 10px;
            background: var(--gray-100);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: var(--gray-600);
            transition: all 0.2s;
        }
        
        .modo-tab.active {
            background: var(--primary);
            color: white;
        }
        
        /* Historial */
        .historial-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray-200);
            font-size: 13px;
        }
        
        .historial-midf {
            font-family: monospace;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- ============================================================
         HTML ESTRUCTURA
         ============================================================ -->
    
    <div class="header">
        <h1>🔧 MIDF-MCF System v3.0</h1>
        <p>Manassero Internal Degradation Framework — Manassero Creation Framework</p>
    </div>
    
    <div class="container">
        <!-- Panel izquierdo: Configuración y entrada -->
        <div class="panel">
            <h2>⚙️ Configuración</h2>
            
            <!-- Selector de modo -->
            <div class="modo-tabs">
                <button class="modo-tab active" onclick="cambiarModo('tasa_directa')">
                    Tasa Directa
                </button>
                <button class="modo-tab" onclick="cambiarModo('phi_normalizado')">
                    Φ Normalizado
                </button>
            </div>
            
            <!-- Formulario dinámico -->
            <form id="formMIDF">
                <div id="camposDinamicos">
                    <!-- Se llena con JS -->
                </div>
                
                <button type="submit">📊 Calcular MIDF-MCF</button>
            </form>
            
            <div style="margin-top: 20px;">
                <button class="btn-sec" onclick="descargarBackup()">💾 Backup JSON</button>
                <button class="btn-sec" onclick="cargarBackup()">📁 Cargar</button>
                <input type="file" id="fileInput" style="display:none" accept=".json">
            </div>
            
            <div class="seccion" id="historialPanel" style="display:none;">
                <h4>📈 Historial reciente</h4>
                <div id="listaHistorial"></div>
            </div>
        </div>
        
        <!-- Panel derecho: Resultados -->
        <div class="panel">
            <div id="resultadoContainer">
                <div class="empty-state">
                    <div class="empty-state-icon">📊</div>
                    <p>Ingrese los datos de su equipo y presione <strong>Calcular</strong></p>
                    <p style="font-size: 12px; margin-top: 10px;">
                        El sistema determinará qué falla primero, cuánto tiempo le queda y por qué.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- ============================================================
         JAVASCRIPT INTEGRADO
         ============================================================ -->
    
    <script>
        // ============================================================
        // CONFIGURACIÓN Y CONSTANTES
        // ============================================================
        
        const CONFIG = {
            VERSION: '3.0-puro',
            PHI_MIN: 0.0,
            PHI_MAX: 1.0,
            HISTORIAL_MAX: 50,
            TABLA_MCF: {
                'lubricacion':          { R: 0.00, epsilon: null, C: 0.85, desc: 'Lubricación básica' },
                'ajuste':               { R: 0.00, epsilon: null, C: 0.75, desc: 'Ajuste/alineación' },
                'alineacion':           { R: 0.00, epsilon: null, C: 0.70, desc: 'Alineación láser' },
                'limpieza':             { R: 0.00, epsilon: null, C: 0.90, desc: 'Limpieza general' },
                'recalibracion':        { R: 0.00, epsilon: null, C: 0.80, desc: 'Recalibración' },
                'reemplazo_parcial':    { R: 0.10, epsilon: null, C: 0.55, desc: 'Cambio componente' },
                'overhaul':             { R: 0.00, epsilon: 0.05, C: 0.15, desc: 'Overhaul completo' },
                'reemplazo_total':      { R: 0.00, epsilon: 0.02, C: 1.00, desc: 'Reemplazo total' }
            }
        };

        // ============================================================
        // CLASES DEL MOTOR MIDF-MCF
        // ============================================================
        
        class ProcesadorTasaDirecta {
            constructor(cfg) {
                this.lambdaBase = cfg.lambdaBase;
                this.factores = {
                    L: { valor: cfg.factoresIniciales?.L ?? 1.0, desc: 'Carga operativa' },
                    E: { valor: cfg.factoresIniciales?.E ?? 1.0, desc: 'Ambiental' },
                    G: { valor: cfg.factoresIniciales?.G ?? 1.0, desc: 'Gravedad' },
                    P: { valor: cfg.factoresIniciales?.P ?? 1.0, desc: 'Presión atmosférica' },
                    S: { valor: cfg.factoresIniciales?.S ?? 1.0, desc: 'Superficie/Sección' },
                    C: { valor: cfg.factoresIniciales?.C ?? 1.0, desc: 'MCF' }
                };
                this.D_acumulado = 0;
                this.t_ultimo = null;
                this.historial = [];
            }

            calcular(nuevosFactores, timestamp) {
                Object.keys(nuevosFactores).forEach(k => {
                    if (this.factores[k]) this.factores[k].valor = nuevosFactores[k];
                });

                const producto = Object.values(this.factores).reduce((p, f) => p * f.valor, 1);
                const lambdaEfectiva = this.lambdaBase * producto;

                let deltaD = 0, deltaT = 0;
                if (this.t_ultimo) {
                    deltaT = (new Date(timestamp) - new Date(this.t_ultimo)) / 3600000;
                    if (deltaT > 0) {
                        deltaD = lambdaEfectiva * deltaT;
                        this.D_acumulado += deltaD;
                    }
                }
                this.t_ultimo = timestamp;
                this.D_acumulado = Math.min(1, Math.max(0, this.D_acumulado));

                // Guardar en historial
                this.historial.push({
                    t: timestamp,
                    D: this.D_acumulado,
                    MCF: 1 - this.D_acumulado,
                    lambda: lambdaEfectiva
                });
                if (this.historial.length > CONFIG.HISTORIAL_MAX) {
                    this.historial.shift();
                }

                return {
                    tipo: 'F',
                    factores: Object.fromEntries(Object.entries(this.factores).map(([k,v]) => [k, v.valor])),
                    lambda_base: this.lambdaBase,
                    lambda_efectiva: lambdaEfectiva,
                    delta_t_horas: deltaT,
                    delta_D: deltaD,
                    D_acumulado: this.D_acumulado,
                    MCF: 1 - this.D_acumulado,
                    tiempo_restante_horas: this.D_acumulado < 1 ? (1 - this.D_acumulado) / lambdaEfectiva : 0
                };
            }

            aplicarMCF(tipoEvento) {
                const efecto = CONFIG.TABLA_MCF[tipoEvento];
                if (!efecto) return null;
                
                const D_antes = this.D_acumulado;
                
                if (efecto.epsilon !== null) {
                    this.D_acumulado = efecto.epsilon;
                } else if (efecto.R > 0) {
                    this.D_acumulado = Math.max(0, this.D_acumulado - efecto.R);
                }
                
                this.factores.C.valor = efecto.C;
                
                return {
                    evento: tipoEvento,
                    D_antes,
                    D_despues: this.D_acumulado,
                    C_nuevo: efecto.C
                };
            }

            getEstado() {
                return {
                    D: this.D_acumulado,
                    MCF: 1 - this.D_acumulado,
                    C: this.factores.C.valor,
                    historial: [...this.historial]
                };
            }

            setEstado(estado) {
                if (estado.D !== undefined) this.D_acumulado = estado.D;
                if (estado.C !== undefined) this.factores.C.valor = estado.C;
                if (estado.historial) this.historial = estado.historial;
            }
        }

        // ============================================================
        // ESTADO GLOBAL DE LA APLICACIÓN
        // ============================================================
        
        let appState = {
            modo: 'tasa_directa', // 'tasa_directa' | 'phi_normalizado'
            subsistema: null,
            config: null
        };

        // Configuraciones predefinidas
        const CONFIGS = {
            tasa_directa: {
                id: 'BOMBA-P101',
                codigo: 'BOMBA_P101',
                nombre: 'Bomba Centrífuga P-101',
                modoOperacion: 'tasa_directa',
                lambdaBase: 0.00005,
                factoresIniciales: { L: 1.0, E: 1.0, G: 1.0, P: 1.0, S: 1.0, C: 1.0 },
                umbrales: { amarillo: 0.30, rojo: 0.60, critico: 0.85 },
                descripcion: 'Modo Manual 2.4: λ = λ_base × L × E × G × P × S × C'
            },
            phi_normalizado: {
                id: 'ROD-EJE2',
                codigo: 'EJE2_ROD',
                nombre: 'Rulemán Eje 2',
                modoOperacion: 'phi_normalizado',
                // Simplificado para demo - en producción tendría procesadores A,B,E
                umbrales: { amarillo: 0.30, rojo: 0.60, critico: 0.85 },
                descripcion: 'Modo sensores: Φ vibración + Φ fatiga + Φ geométrica'
            }
        };

        // ============================================================
        // FUNCIONES DE UI
        // ============================================================
        
        function init() {
            cambiarModo('tasa_directa');
            
            // Setup file input
            document.getElementById('fileInput').onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    try {
                        const data = JSON.parse(event.target.result);
                        cargarEstadoDesdeJSON(data);
                        alert('✅ Configuración cargada correctamente');
                    } catch(err) {
                        alert('❌ Error al cargar archivo: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
        }

        function cambiarModo(modo) {
            appState.modo = modo;
            appState.config = CONFIGS[modo];
            
            // Actualizar tabs
            document.querySelectorAll('.modo-tab').forEach((tab, idx) => {
                tab.classList.toggle('acti
