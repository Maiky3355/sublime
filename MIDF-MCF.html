<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MIDF–MCF V4.1 | Engineering Console</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f1f5f9;display:flex;height:100vh}
.sidebar{width:440px;background:white;padding:20px;overflow:auto;border-right:2px solid #e2e8f0}
.main{flex:1;padding:25px;overflow:auto}
h2{font-size:0.8rem;color:#1e3a8a;text-transform:uppercase;margin-top:25px}
label{font-size:0.75rem;font-weight:700;color:#334155}
input,select{width:100%;padding:8px;margin-bottom:10px;border:1px solid #cbd5e1;border-radius:6px}
button{width:100%;padding:10px;border:none;border-radius:6px;background:#1e3a8a;color:white;font-weight:700;cursor:pointer;margin-top:10px}
table{width:100%;border-collapse:collapse;background:white;margin-top:20px}
th,td{padding:10px;border-bottom:1px solid #e2e8f0;font-size:0.85rem;text-align:center}
.green{background:#dcfce7;color:#065f46;font-weight:700}
.yellow{background:#fef9c3;color:#854d0e;font-weight:700}
.red{background:#fee2e2;color:#991b1b;font-weight:700}
canvas{background:white;padding:15px;border-radius:10px;margin-top:20px}
.statusBox{padding:8px;border-radius:6px;font-weight:800}
</style>
</head>

<body>

<div class="sidebar">

<h2>1. Identificación del Subsistema</h2>

<label>Nombre del Subsistema</label>
<input id="name" placeholder="Ej: Rodamiento Lado Motor">

<label>Vida Nominal de Diseño (horas)</label>
<input id="life" type="number" value="25000">

<label>Peso de Criticidad w_i (1–100)</label>
<input id="weight" type="number" value="10">

<h2>2. Carga Operativa</h2>

<label>Carga de Diseño (misma unidad que real)</label>
<input id="designLoad" type="number" value="100">

<label>Carga Real Medida (sensor o cálculo)</label>
<input id="realLoad" type="number" value="110">

<label>Tipo de Tratamiento de Señal</label>
<select id="signal">
<option value="avg">Promedio</option>
<option value="rms">RMS (vibración)</option>
<option value="peak">Pico</option>
</select>

<h2>3. Factores Ambientales y Físicos</h2>

<label>Factor Ambiental E (corrosión, polvo, humedad)</label>
<input id="env" type="number" value="1" step="0.1">

<label>Factor Presión P (si aplica hidráulica)</label>
<input id="pressure" type="number" value="1" step="0.1">

<label>Factor Gravedad G (si afecta tensiones)</label>
<input id="gravity" type="number" value="1" step="0.1">

<label>Superficie Activa S (0–1)</label>
<input id="surface" type="number" value="1" step="0.1">

<label>Factor Solar / UV (si aplica exteriores)</label>
<input id="uv" type="number" value="1" step="0.1">

<label>Factor MCF (Acción de Mantenimiento)</label>
<input id="mcf" type="number" value="1" step="0.05">

<label>Horas desde último registro (Δt)</label>
<input id="dt" type="number" value="100">

<h2>ISO 281 (Rodamientos - opcional)</h2>

<label>Capacidad Dinámica C (kN)</label>
<input id="Cdyn" type="number">

<label>Carga Equivalente P (kN)</label>
<input id="Pdyn
