<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MIDF–MCF ENGINE V5.0 INDUSTRIAL</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{font-family:Arial;background:#f3f4f6;margin:0;display:flex;height:100vh}
.sidebar{width:420px;background:white;padding:20px;overflow:auto;border-right:2px solid #ddd}
.main{flex:1;padding:25px;overflow:auto}
input,button{width:100%;padding:6px;margin-bottom:8px}
button{background:#1e3a8a;color:white;border:none}
.status{padding:4px 10px;border-radius:15px;font-size:11px;font-weight:bold}
.green{background:#dcfce7;color:#166534}
.yellow{background:#fef9c3;color:#92400e}
.orange{background:#fed7aa;color:#9a3412}
.red{background:#fee2e2;color:#991b1b}
.dark{background:#7f1d1d;color:white}
table{width:100%;border-collapse:collapse}
td,th{padding:6px;border-bottom:1px solid #ddd;font-size:12px}
</style>
</head>
<body>

<div class="sidebar">

<h3>Subsistema</h3>
<input id="name" placeholder="Nombre">
<input type="number" id="life" value="30000" placeholder="Vida nominal">
<input type="number" id="weight" value="10" placeholder="Peso criticidad">

<h3>Variables Base</h3>
<input type="number" id="refLoad" value="100" placeholder="Carga diseño">
<input type="number" id="realLoad" value="110" placeholder="Carga real">
<input type="number" step="0.1" id="env" value="1.0" placeholder="E">
<input type="number" step="0.1" id="pres" value="1.0" placeholder="P">
<input type="number" step="0.1" id="grav" value="1.0" placeholder="G">
<input type="number" step="0.1" id="surf" value="1.0" placeholder="S">
<input type="number" step="0.1" id="mcf" value="1.0" placeholder="C">

<h3>Factores dinámicos</h3>
<div id="factors"></div>
<button onclick="addFactor()">+ Factor</button>

<input type="number" id="dt" value="1000" placeholder="Δt horas">
<button onclick="calculate()">Calcular</button>
<button onclick="exportJSON()">Export JSON</button>

</div>

<div class="main">

<h2>D_sys: <span id="dsys">0</span></h2>
<h3>Subsistema crítico: <span id="critical"></span></h3>

<table>
<thead>
<tr>
<th>Nombre</th>
<th>D</th>
<th>λ</th>
<th>TTF P50</th>
<th>TTF P10</th>
<th>TTF P90</th>
<th>Estado</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<canvas id="chart"></canvas>

</div>

<script>

let db=[];
let chart;

function addFactor(){
    const div=document.createElement("div");
    div.innerHTML=`<input class="fname" placeholder="Nombre factor">
                   <input type="number" step="0.1" class="fval" value="1.0">`;
    document.getElementById("factors").appendChild(div);
}

function status(d){
if(d<0.4) return ["OPERATIVO","green"];
if(d<0.7) return ["ALERTA","yellow"];
if(d<1.0) return ["CRITICO","orange"];
if(d<1.5) return ["FALLA","red"];
return ["CATASTROFICO","dark"];
}

function calculate(){

let name=document.getElementById("name").value;
let life=1/parseFloat(document.getElementById("life").value);
let weight=parseFloat(document.getElementById("weight").value);

let L=parseFloat(document.getElementById("realLoad").value)/
      parseFloat(document.getElementById("refLoad").value);
let E=parseFloat(document.getElementById("env").value);
let P=parseFloat(document.getElementById("pres").value);
let G=parseFloat(document.getElementById("grav").value);
let S=parseFloat(document.getElementById("surf").value);
let C=parseFloat(document.getElementById("mcf").value);

let F=1;
let fn=document.querySelectorAll(".fname");
let fv=document.querySelectorAll(".fval");
let factors=[];

fn.forEach((n,i)=>{
let v=parseFloat(fv[i].value);
F*=v;
factors.push({name:n.value,value:v});
});

let lambda=life*L*E*P*G*S*C*F;
let dt=parseFloat(document.getElementById("dt").value);

let sub=db.find(x=>x.name===name);
if(!sub){
sub={name:name,d:0,weight:weight,history:[]};
db.push(sub);
}

sub.d+=lambda*dt;
sub.lambda=lambda;
sub.ttf50=(1-sub.d)/lambda;
sub.ttf10=(1-sub.d)/(lambda*1.15);
sub.ttf90=(1-sub.d)/(lambda*0.85);
sub.history.push(sub.d);

render();
}

function render(){

let table=document.getElementById("table");
table.innerHTML="";
let totalWeight=db.reduce((a,b)=>a+b.weight,0);
let dsys=0;
let criticalSub="";
let minTTF=Infinity;

db.forEach(s=>{
dsys+=s.d*(s.weight/totalWeight);

if(s.ttf50<minTTF){minTTF=s.ttf50;criticalSub=s.name;}

let st=status(s.d);

table.innerHTML+=`
<tr>
<td>${s.name}</td>
<td>${s.d.toFixed(3)}</td>
<td>${s.lambda.toExponential(2)}</td>
<td>${Math.round(s.ttf50)}</td>
<td>${Math.round(s.ttf10)}</td>
<td>${Math.round(s.ttf90)}</td>
<td><span class="status ${st[1]}">${st[0]}</span></td>
</tr>`;
});

document.getElementById("dsys").innerText=dsys.toFixed(3);
document.getElementById("critical").innerText=criticalSub;

renderChart();
}

function renderChart(){
const ctx=document.getElementById("chart").getContext("2d");
if(chart) chart.destroy();

chart=new Chart(ctx,{
type:'line',
data:{
labels:Array.from({length:db[0]?.history.length||0},(_,i)=>i),
datasets:db.map(s=>({label:s.name,data:s.history,fill:false}))
}
});
}

function exportJSON(){
let data="data:text/json;charset=utf-8,"+
encodeURIComponent(JSON.stringify(db,null,2));
let a=document.createElement("a");
a.href=data;
a.download="midf_mcf_v5_log.json";
a.click();
}

</script>
</body>
  </html>
